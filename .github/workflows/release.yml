name: Release helper

# Push a version tag (e.g. v1.0.0) to build the helper exe + installer and publish a Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish single-file self-contained exe
        run: >
          dotnet publish src/Helper/Helper.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.ver.outputs.version }}
          installer\ValheimWorldKeeper.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Valheim World Keeper ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            installer/output/ValheimWorldKeeper-Setup.exe
            publish/ValheimWorldKeeper.exe
